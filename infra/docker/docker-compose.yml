# 로컬 테스트 스택: 모의 BFF + 프론트 개발 서버
#   cd infra/docker && docker compose up
#   web  → http://localhost:5173   (VITE_BFF_URL=http://localhost:8787)
#   bff  → http://localhost:8787/v1/weather/KR-SEL?scenario=stale
services:
  mock-bff:
    image: node:22-alpine
    working_dir: /repo
    volumes:
      - ../..:/repo
    command: node backend/mock-bff/server.mjs
    environment:
      - PORT=8787
    ports:
      - "8787:8787"
  web:
    image: node:22-alpine
    working_dir: /repo/frontend
    volumes:
      - ../..:/repo
      - web_node_modules:/repo/frontend/node_modules
    command: sh -c "npm install --no-audit --no-fund && npx vite --host 0.0.0.0"
    environment:
      - VITE_BFF_URL=http://localhost:8787
    ports:
      - "5173:5173"
    depends_on:
      - mock-bff
volumes:
  web_node_modules:
